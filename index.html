<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <script>
      try {
        var theme = localStorage.getItem('biblia-tanakh:theme');
        if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#f7f4ec');
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Bíblia Origens — Sua fé, direto da fonte. Leitura com texto original, transliteração e português" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bíblia Origens" />
    <meta name="application-name" content="Bíblia Origens" />
    <link rel="preload" as="image" href="/splash-mobile.jpg" media="(max-width: 767px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/splash.jpg" media="(min-width: 768px)" fetchpriority="high" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bíblia Origens</title>
    <style>
      /* Critical splash paint before CSS bundle loads */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        overflow: hidden;
        background: #050505;
        color: #d4a017;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #splash .splash__inner {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        overflow: hidden;
        padding: max(1rem, env(safe-area-inset-top, 0px)) max(1rem, env(safe-area-inset-right, 0px)) max(1rem, env(safe-area-inset-bottom, 0px)) max(1rem, env(safe-area-inset-left, 0px));
      }
      #splash .splash__art {
        display: block;
        width: min(100%, 80rem);
        max-height: 64vh;
        height: auto;
        object-fit: contain;
        flex: 0 1 auto;
        border-radius: clamp(1rem, 3vw, 2rem);
        /* Let the art dissolve gently into the black splash background. */
        -webkit-mask-image:
          linear-gradient(to right, transparent 0%, #000 5%, #000 95%, transparent 100%),
          linear-gradient(to bottom, transparent 0%, #000 7%, #000 93%, transparent 100%);
        -webkit-mask-composite: source-in;
        mask-image:
          linear-gradient(to right, transparent 0%, #000 5%, #000 95%, transparent 100%),
          linear-gradient(to bottom, transparent 0%, #000 7%, #000 93%, transparent 100%);
        mask-composite: intersect;
      }
      #splash .splash__content {
        position: relative;
        z-index: 1;
        margin-top: clamp(0.85rem, 3vh, 1.75rem);
      }
      #splash .splash__slogan {
        margin: 0;
        font-size: clamp(0.85rem, 2.5vw, 1.15rem);
        font-weight: 500;
        line-height: 1.4;
        letter-spacing: 0.045em;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
      }
      #splash .splash__spinner {
        position: absolute;
        left: 50%;
        top: 70%;
        width: 46px;
        height: 46px;
        margin: 0;
        transform: translate(-50%, -50%);
        color: #d4a017;
        filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.55));
      }
      #splash .splash__spinner svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        animation: splash-spinner-rotate 1.35s linear infinite;
      }
      #splash .splash__spinner-track {
        fill: none;
        stroke: rgba(255, 193, 7, 0.16);
        stroke-width: 2.5;
      }
      #splash .splash__spinner-arc {
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-width: 2.5;
        stroke-dasharray: 72 42;
      }
      @keyframes splash-spinner-rotate {
        to { transform: rotate(360deg); }
      }
      /* Narrow screens use the portrait art edge-to-edge; desktop keeps the framed art. */
      @media (max-width: 767px) {
        #splash .splash__inner { padding: 0; }
        #splash .splash__art {
          content: url('/splash-mobile.jpg');
          position: absolute;
          inset: 0;
          width: 100%;
          max-width: none;
          height: 100%;
          max-height: none;
          object-fit: cover;
          border-radius: 0;
          filter: none;
          -webkit-mask-image: none;
          mask-image: none;
        }
        #splash .splash__content {
          position: absolute;
          left: 1rem;
          right: 1rem;
          bottom: 17%;
          margin: 0;
        }
        #splash .splash__spinner { top: 86%; }
      }
      @media (min-width: 768px) {
        #splash .splash__spinner { top: 76%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash__spinner svg { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" class="splash" role="dialog" aria-modal="true" aria-label="Bíblia Origens">
      <div class="splash__inner">
        <img class="splash__art" src="/splash.jpg" alt="" width="2816" height="1536" fetchpriority="high" decoding="async" />
        <div class="splash__content">
          <p class="splash__slogan" aria-label="Sua fé, direto da fonte">
            <span class="splash__slogan-text" aria-hidden="true">Sua fé, direto da fonte</span>
            <span class="splash__line" aria-hidden="true"></span>
          </p>
        </div>
        <div class="splash__spinner" role="status" aria-label="Carregando">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <circle class="splash__spinner-track" cx="24" cy="24" r="18" />
            <circle class="splash__spinner-arc" cx="24" cy="24" r="18" />
          </svg>
        </div>
      </div>
    </div>
    <script>
      /* Skip splash on same-tab navigations / reloads within the session */
      try {
        if (sessionStorage.getItem('tanakh-splash-seen-v2') === '1') {
          var s = document.getElementById('splash');
          if (s) s.remove();
        }
      } catch (e) {}
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
