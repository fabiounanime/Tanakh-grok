<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Bíblia Origens — Sua fé, direto da fonte. Leitura com texto original, transliteração e português" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bíblia Origens" />
    <meta name="application-name" content="Bíblia Origens" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bíblia Origens</title>
    <style>
      /* Critical splash paint before CSS bundle loads */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050505;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #splash .splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 100%;
        max-width: 48rem;
        padding-top: max(1.5rem, calc(env(safe-area-inset-top, 0px) + 1rem));
        padding-bottom: max(1.5rem, calc(env(safe-area-inset-bottom, 0px) + 1rem));
        padding-left: max(clamp(1rem, 5vw, 3rem), env(safe-area-inset-left, 0px));
        padding-right: max(clamp(1rem, 5vw, 3rem), env(safe-area-inset-right, 0px));
      }
      #splash .splash__mark {
        color: #ffc107;
        font-size: 1.75rem;
        line-height: 1;
        margin-bottom: 0.85rem;
      }
      #splash .splash__title {
        margin: 0;
        font-size: 1.65rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      #splash .splash__slogan {
        margin: 0.85rem 0 0;
        max-width: 100%;
        font-size: clamp(0.7rem, 3.4vw, 1rem);
        line-height: 1.45;
        letter-spacing: 0.025em;
        color: #ffc107;
        opacity: 0.92;
      }
      #splash .splash__slogan-line {
        display: block;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="splash" class="splash" role="dialog" aria-modal="true" aria-label="Bíblia Origens">
      <div class="splash__inner">
        <span class="splash__mark" aria-hidden="true">✦</span>
        <p class="splash__title">Bíblia Origens</p>
        <p class="splash__slogan">
          <span class="splash__slogan-line">Sua fé, direto da fonte</span>
          <span class="splash__slogan-line">Português • Hebraico • Transliteração</span>
        </p>
      </div>
    </div>
    <script>
      /* Skip splash on same-tab navigations / reloads within the session */
      try {
        if (sessionStorage.getItem('tanakh-splash-seen') === '1') {
          var s = document.getElementById('splash');
          if (s) s.remove();
        }
      } catch (e) {}
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
