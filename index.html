<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Bíblia Origens — Sua fé, direto da fonte. Leitura com texto original, transliteração e português" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bíblia Origens" />
    <meta name="application-name" content="Bíblia Origens" />
    <link rel="preload" as="image" href="/splash.jpg" fetchpriority="high" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bíblia Origens</title>
    <style>
      /* Critical splash paint before CSS bundle loads */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        overflow: hidden;
        background-color: #050505;
        background-image:
          linear-gradient(rgba(5, 5, 5, 0.14), rgba(5, 5, 5, 0.14)),
          url('/splash.jpg');
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        color: #ffc107;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #splash .splash__inner {
        position: absolute;
        inset: 0;
      }
      #splash .splash__spinner {
        position: absolute;
        left: 50%;
        bottom: max(2.5rem, calc(env(safe-area-inset-bottom, 0px) + 2rem));
        width: 46px;
        height: 46px;
        margin: 0;
        transform: translateX(-50%);
        color: #ffc107;
        filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.55));
      }
      #splash .splash__spinner svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        animation: splash-spinner-rotate 1.35s linear infinite;
      }
      #splash .splash__spinner-track {
        fill: none;
        stroke: rgba(255, 193, 7, 0.16);
        stroke-width: 2.5;
      }
      #splash .splash__spinner-arc {
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-width: 2.5;
        stroke-dasharray: 72 42;
      }
      @keyframes splash-spinner-rotate {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash__spinner svg { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" class="splash" role="dialog" aria-modal="true" aria-label="Bíblia Origens">
      <div class="splash__inner">
        <div class="splash__spinner" role="status" aria-label="Carregando">
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <circle class="splash__spinner-track" cx="24" cy="24" r="18" />
            <circle class="splash__spinner-arc" cx="24" cy="24" r="18" />
          </svg>
        </div>
      </div>
    </div>
    <script>
      /* Skip splash on same-tab navigations / reloads within the session */
      try {
        if (sessionStorage.getItem('tanakh-splash-seen') === '1') {
          var s = document.getElementById('splash');
          if (s) s.remove();
        }
      } catch (e) {}
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
