<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Bíblia / Tanakh — leitura com texto original, transliteração e português" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tanakh" />
    <meta name="application-name" content="Bíblia Tanakh" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bíblia / Tanakh</title>
    <style>
      /* Critical splash paint before CSS bundle loads */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050505;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #splash .splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 1.5rem;
      }
      #splash .splash__mark {
        color: #ffc107;
        font-size: 1.75rem;
        line-height: 1;
        margin-bottom: 0.85rem;
      }
      #splash .splash__title {
        margin: 0;
        font-size: 1.65rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      #splash .splash__slogan {
        margin: 0.85rem 0 0;
        font-size: 0.95rem;
        letter-spacing: 0.04em;
        color: #ffc107;
        opacity: 0.92;
      }
    </style>
  </head>
  <body>
    <div id="splash" class="splash" role="dialog" aria-modal="true" aria-label="Bíblia Tanakh">
      <div class="splash__inner">
        <span class="splash__mark" aria-hidden="true">✦</span>
        <p class="splash__title">Bíblia Tanakh</p>
        <p class="splash__slogan">Prepare seu coração.</p>
      </div>
    </div>
    <script>
      /* Skip splash on same-tab navigations / reloads within the session */
      try {
        if (sessionStorage.getItem('tanakh-splash-seen') === '1') {
          var s = document.getElementById('splash');
          if (s) s.remove();
        }
      } catch (e) {}
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
